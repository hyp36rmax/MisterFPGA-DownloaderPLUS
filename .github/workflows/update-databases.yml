name: Update databases

on:
  push:
    branches:
      - feature/protected-database-updates
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      verify_app_only:
        description: Verify publication authentication without changing branches or PRs
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: downloaderplus-database-publish
  cancel-in-progress: false

jobs:
  authentication:
    if: (github.event_name == 'workflow_dispatch' && inputs.verify_app_only) || (github.event_name == 'push' && github.ref == 'refs/heads/feature/protected-database-updates')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Obtain repository publication token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.DOWNLOADERPLUS_APP_ID }}
          private-key: ${{ secrets.DOWNLOADERPLUS_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Verify authentication and installation without publication
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python tools/scheduled_update.py check-app

  update:
    if: github.ref == 'refs/heads/main' && !inputs.verify_app_only
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build and validate one complete publication cycle
        id: cycle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/scheduled_update.py collect --plan "$RUNNER_TEMP/database-publication.json"
      - name: Obtain repository publication token
        if: steps.cycle.outputs.changed == 'true'
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.DOWNLOADERPLUS_APP_ID }}
          private-key: ${{ secrets.DOWNLOADERPLUS_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Publish validated batch through a protected PR
        id: publication
        if: steps.cycle.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python tools/scheduled_update.py publish --plan "$RUNNER_TEMP/database-publication.json"
      - name: Confirm normal PR validation runs and passes
        if: steps.cycle.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/scheduled_update.py wait-validation --pr "${{ steps.publication.outputs.pr }}" --head "${{ steps.publication.outputs.head }}"
      - name: Enable normal protected auto-merge after PR validation
        if: steps.cycle.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python tools/scheduled_update.py enable-auto-merge --pr "${{ steps.publication.outputs.pr }}" --head "${{ steps.publication.outputs.head }}"
