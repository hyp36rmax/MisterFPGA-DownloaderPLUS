name: Update databases

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: downloaderplus-database-publish
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test safety contract
        run: python -m unittest discover -s tests -v
      - name: Fetch, validate, transform, and compare every module
        run: python tools/build.py --all
      - name: Verify all distribution artifacts
        run: python tools/verify_dist.py
      - name: Publish only validated changes
        run: |
          git add -- dist
          if git diff --cached --quiet; then
            echo "No material changes; no commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update validated derived databases'
          git push origin HEAD:"${{ github.event.repository.default_branch }}"
