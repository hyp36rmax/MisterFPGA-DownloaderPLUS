name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check changed public documentation encoding
        env:
          DOCUMENTATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$DOCUMENTATION_BASE" ] && [ "$DOCUMENTATION_BASE" != 0000000000000000000000000000000000000000 ]; then
            python tools/check_documentation_encoding.py --base "$DOCUMENTATION_BASE"
          else
            python tools/check_documentation_encoding.py
          fi
      - name: Run offline regression and safety tests
        run: python -m unittest discover -s tests -v
      - name: Validate the maintained STG master matrix
        run: python tools/audit_stg_matrix.py
      - name: Validate public STG master parity
        run: python tools/audit_stg_master.py
      - name: Validate the independent TATE collection
        run: python tools/audit_stg_collection.py
      - name: Validate the published module catalog
        run: python tools/check_module_catalog.py
      - name: Validate README systems and documentation links
        run: python tools/check_readme_documentation.py
      - name: Verify the inspected snapshot through both CLIs
        run: |
          python tools/build.py --module coinop-collection --upstream-file tests/fixtures/coinop-2026-09-30.db.json.zip --output-dir "$RUNNER_TEMP/coinop"
          python tools/validate.py --module coinop-collection --upstream tests/fixtures/coinop-2026-09-30.db.json.zip --generated "$RUNNER_TEMP/coinop/coinop-collection.json.zip"
      - name: Verify BP964-BP965 and SSV selections through both CLIs
        run: |
          python tools/build.py --module banpresto-bp964-bp965 --upstream-file tests/fixtures/kuzecores-2026-10-03.db.json.zip --output-dir "$RUNNER_TEMP/banpresto"
          python tools/validate.py --module banpresto-bp964-bp965 --upstream tests/fixtures/kuzecores-2026-10-03.db.json.zip --generated "$RUNNER_TEMP/banpresto/banpresto-bp964-bp965.json.zip"
          python tools/build.py --module ssv --upstream-file tests/fixtures/meatcores-2026-10-03.db.json.zip --output-dir "$RUNNER_TEMP/ssv"
          python tools/validate.py --module ssv --upstream tests/fixtures/meatcores-2026-10-03.db.json.zip --generated "$RUNNER_TEMP/ssv/ssv.json.zip"
      - name: Verify tracked distribution integrity
        run: python tools/verify_dist.py
      - name: Verify both MeatCores selections through both CLIs
        run: |
          for module in sega-system32 sega-system32-multi; do
            python tools/build.py --module "$module" --upstream-file tests/fixtures/meatcores-2026-09-30.db.json.zip --output-dir "$RUNNER_TEMP/$module"
            python tools/validate.py --module "$module" --upstream tests/fixtures/meatcores-2026-09-30.db.json.zip --generated "$RUNNER_TEMP/$module/$module.json.zip"
          done
      - name: Audit recursive alternatives parity
        run: python tools/audit_alternatives.py
      - name: Audit Arcade Systems registry and ownership
        run: python tools/audit_arcade_systems.py
      - name: Audit complete public Coin-Op coverage
        run: python tools/audit_coinop_coverage.py
      - name: Audit hardware-module default filters
        run: python tools/audit_filters.py
      - name: Verify all CPS selections through both CLIs
        run: |
          for module in capcom-cps1 capcom-cps15 capcom-cps2 capcom-cps3; do
            python tools/build.py --module "$module" --upstream-file tests/fixtures/jtcores-2026-09-30.db.json.zip --output-dir "$RUNNER_TEMP/$module"
            python tools/validate.py --module "$module" --upstream tests/fixtures/jtcores-2026-09-30.db.json.zip --generated "$RUNNER_TEMP/$module/$module.json.zip"
          done
      - name: Verify official ST-V selective archive through both CLIs
        run: |
          python tools/build.py --module sega-stv --upstream-file tests/fixtures/mister-2026-09-30.db.json.zip --output-dir "$RUNNER_TEMP/stv"
          python tools/validate.py --module sega-stv --upstream tests/fixtures/mister-2026-09-30.db.json.zip --generated "$RUNNER_TEMP/stv/sega-stv.json.zip"
      - name: Verify the confirmed Sega, IREM and Technosoft batch offline
        run: |
          for module in sega-system16 sega-system18 irem-m62 irem-m72 irem-m90 irem-m92 technosoft taito-f2; do
            fixture=tests/fixtures/mister-2026-09-30.db.json.zip
            case "$module" in sega-system16|sega-system18) fixture=tests/fixtures/jtcores-2026-09-30.db.json.zip ;; esac
            python tools/build.py --module "$module" --upstream-file "$fixture" --output-dir "$RUNNER_TEMP/$module"
            python tools/validate.py --module "$module" --upstream "$fixture" --generated "$RUNNER_TEMP/$module/$module.json.zip"
          done
